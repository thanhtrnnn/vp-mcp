services:
  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vp-mcp-proxy
    ports:
      - "2027:2026"
    environment:
      - VP_API_URL=http://host.docker.internal:2026
      - MCP_PORT=2026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "2", "http://localhost:2026/sse"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
